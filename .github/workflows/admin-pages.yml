name: Deploy admin dashboard

# Builds the reviewer/admin dashboard and publishes it on GitHub Pages at
# https://<owner>.github.io/CampusNiaga/.
# The build runs on every change to admin/ on main. The deploy step runs only
# once Pages is switched on and the repository variable ADMIN_PAGES_ENABLED is
# "true" (docs/deployment.md), so the workflow stays green until then.

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build for GitHub Pages
        run: |
          npx vite build --base="/${{ github.event.repository.name }}/"
          # Pages has no server-side routing: serve the app for unknown paths
          # too, so links such as /applications/<id> open directly.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    name: Deploy
    needs: build
    if: vars.ADMIN_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
